name: G&B Autonomous Development

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run scout or builder"
        type: choice
        options: [scout, builder]
        default: scout
      issue_number:
        description: "Issue number for builder mode"
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  scout:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'scout')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gh CLI
        run: sudo apt-get update && sudo apt-get install -y gh
      - name: Authenticate GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git
      - name: Run Scout
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.AUTODEV_MODEL }}
          GH_TOKEN: ${{ github.token }}
        run: python tools/autonomous-dev/scout.py

  builder:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'builder'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GitHub CLI
        run: sudo apt-get update && sudo apt-get install -y gh
      - name: Authenticate GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git
      - name: Configure git identity
        run: |
          git config user.name "g-and-b-autonomous-dev"
          git config user.email "actions@users.noreply.github.com"
      - name: Run Builder
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.AUTODEV_MODEL }}
          GH_TOKEN: ${{ github.token }}
          AUTODEV_MAX_FILES: "8"
          AUTODEV_MAX_TOOL_CALLS: "18"
        run: python tools/autonomous-dev/builder.py "${{ inputs.issue_number }}"
