name: G&B Autonomous Development

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run scout or builder"
        type: choice
        options: [scout, builder]
        default: scout
      issue_number:
        description: "Issue number for builder mode"
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: autonomous-dev-${{ github.ref }}
  cancel-in-progress: false

# Self-hosted execution is restricted to trusted main-branch runs.
# There is intentionally no pull_request trigger for this workflow.
jobs:
  scout:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'scout'))
    runs-on: [self-hosted, windows, x64, gb-autodev]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify local tools and Ollama model
        shell: pwsh
        env:
          OLLAMA_MODEL: ${{ vars.AUTODEV_OLLAMA_MODEL || 'qwen3:8b' }}
        run: |
          if (-not (Get-Command gh -ErrorAction SilentlyContinue)) { throw "GitHub CLI (gh) is required. Install it on the runner host." }
          if (-not (Get-Command ollama -ErrorAction SilentlyContinue)) { throw "Ollama is required. Install it and keep its service running." }
          ollama show "$env:OLLAMA_MODEL"
          if ($LASTEXITCODE -ne 0) { throw "Model '$env:OLLAMA_MODEL' is not installed. Pull it with: ollama pull $env:OLLAMA_MODEL" }
      - name: Authenticate GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git
      - name: Validate autonomous agent syntax
        run: python -m py_compile tools/autonomous-dev/scout.py tools/autonomous-dev/builder.py
      - name: Ensure Scout labels exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create autonomous-ready --color 0E8A16 --description 'Task eligible for guarded autonomous implementation' --force
          gh label create ai-generated --color 5319E7 --description 'Generated by the autonomous Scout agent' --force
      - name: Scout and prioritize ideas
        id: scout
        shell: pwsh
        env:
          OLLAMA_URL: ${{ vars.AUTODEV_OLLAMA_URL || 'http://127.0.0.1:11434/api/chat' }}
          OLLAMA_MODEL: ${{ vars.AUTODEV_OLLAMA_MODEL || 'qwen3:8b' }}
          GH_TOKEN: ${{ github.token }}
        run: python tools/autonomous-dev/scout.py
      - name: Build the highest-ranked idea
        if: steps.scout.outputs.issue_number != ''
        shell: pwsh
        env:
          OLLAMA_URL: ${{ vars.AUTODEV_OLLAMA_URL || 'http://127.0.0.1:11434/api/chat' }}
          OLLAMA_MODEL: ${{ vars.AUTODEV_OLLAMA_MODEL || 'qwen3:8b' }}
          GH_TOKEN: ${{ github.token }}
          AUTODEV_MAX_FILES: "8"
          AUTODEV_MAX_TOOL_CALLS: "18"
        run: |
          git config user.name "g-and-b-autonomous-dev"
          git config user.email "actions@users.noreply.github.com"
          python tools/autonomous-dev/builder.py "${{ steps.scout.outputs.issue_number }}"

  builder:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.mode == 'builder'
    runs-on: [self-hosted, windows, x64, gb-autodev]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify local tools and Ollama model
        shell: pwsh
        env:
          OLLAMA_MODEL: ${{ vars.AUTODEV_OLLAMA_MODEL || 'qwen3:8b' }}
        run: |
          if (-not (Get-Command gh -ErrorAction SilentlyContinue)) { throw "GitHub CLI (gh) is required. Install it on the runner host." }
          if (-not (Get-Command ollama -ErrorAction SilentlyContinue)) { throw "Ollama is required. Install it and keep its service running." }
          ollama show "$env:OLLAMA_MODEL"
          if ($LASTEXITCODE -ne 0) { throw "Model '$env:OLLAMA_MODEL' is not installed. Pull it with: ollama pull $env:OLLAMA_MODEL" }
      - name: Authenticate GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git
      - name: Validate autonomous agent syntax
        run: python -m py_compile tools/autonomous-dev/scout.py tools/autonomous-dev/builder.py
      - name: Configure git identity
        run: |
          git config user.name "g-and-b-autonomous-dev"
          git config user.email "actions@users.noreply.github.com"
      - name: Run Builder
        shell: pwsh
        env:
          OLLAMA_URL: ${{ vars.AUTODEV_OLLAMA_URL || 'http://127.0.0.1:11434/api/chat' }}
          OLLAMA_MODEL: ${{ vars.AUTODEV_OLLAMA_MODEL || 'qwen3:8b' }}
          GH_TOKEN: ${{ github.token }}
          AUTODEV_MAX_FILES: "8"
          AUTODEV_MAX_TOOL_CALLS: "18"
        run: python tools/autonomous-dev/builder.py "${{ inputs.issue_number }}"
