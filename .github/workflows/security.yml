name: Security scans

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-history:
    name: Scan current files and Git history for leaked secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out full Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # PRs only need the current tree; the scheduled/main scan covers full history.
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 0 }}
          persist-credentials: false
      - name: Install pinned Gitleaks release
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl --fail --silent --show-error --location "${base}/${archive}" -o "${archive}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${archive}" | sha256sum --check
          tar -xzf "${archive}" gitleaks
          chmod +x gitleaks
      - name: Scan changed revision files (pull requests)
        if: github.event_name == 'pull_request'
        # A directory scan avoids fetching and replaying the repository's entire history on each PR.
        run: ./gitleaks dir --redact=100 --report-format json --report-path gitleaks-report.json --no-banner --exit-code 1 .
      - name: Scan full Git history (main, scheduled, manual)
        if: github.event_name != 'pull_request'
        # Full history remains covered on main and by the weekly scheduled scan.
        run: ./gitleaks git --redact=100 --report-format json --report-path gitleaks-report.json --no-banner --exit-code 1 .
      - name: Preserve redacted finding metadata
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gitleaks-redacted-report
          path: gitleaks-report.json
          if-no-files-found: ignore
          retention-days: 7
