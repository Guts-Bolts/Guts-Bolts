name: Security scans

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-history:
    name: Scan current files and Git history for leaked secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out full Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks release
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl --fail --silent --show-error --location "${base}/${archive}" -o "${archive}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${archive}" | sha256sum --check
          tar -xzf "${archive}" gitleaks
          chmod +x gitleaks
      - name: Scan all reachable commits and working tree
        # Keep secret values fully redacted while retaining finding metadata for remediation.
        # Gitleaks 8.30.1 accepts the repository as a positional argument.
        run: ./gitleaks git --redact=100 --report-format json --report-path gitleaks-report.json --no-banner --exit-code 1 .
      - name: Preserve redacted finding metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gitleaks-redacted-report
          path: gitleaks-report.json
          if-no-files-found: ignore
          retention-days: 7
