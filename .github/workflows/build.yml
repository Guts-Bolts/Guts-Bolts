# Builds Guts and Bolts for every platform. Pushing a tag like v0.4.0 also
# publishes a GitHub release with the Android app and the computer versions.
name: Build

# A commit whose message contains "[release vX.Y.Z]" (on main or a work branch)
# also publishes a release, for when pushing tags isn't possible.
on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write


jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check every website and server script for mistakes
        run: for f in worker/*.js website/app/*.js; do node --check "$f" || exit 1; done
      - name: Gather the update log
        run: node worker/gather-updates.mjs
      - name: Run the tests
        run: node --no-warnings --import ./worker/test/register.mjs --test 'worker/test/*.test.mjs'

  android:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release v')
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264" "cmake;3.31.5" "platforms;android-34" "build-tools;34.0.0"
      - name: Version
        id: ver
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          # The version in CMakeLists.txt (so the app never shows an old number).
          v="$(sed -n 's/^project(GutsAndBolts VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)-dev"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; fi
          if [[ "$MSG" =~ \[release\ v([0-9][0-9A-Za-z.\-]*)\] ]]; then v="${BASH_REMATCH[1]}"; fi
          echo "name=$v" >> "$GITHUB_OUTPUT"
          echo "code=$(( GITHUB_RUN_NUMBER + 10 ))" >> "$GITHUB_OUTPUT"
      - name: Signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "GB_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi
      - name: Build the APK
        working-directory: android
        env:
          GB_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GB_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GB_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon -PgbVersion=${{ steps.ver.outputs.name }} -PgbVersionCode=${{ steps.ver.outputs.code }}
      - name: Rename
        run: |
          cp android/app/build/outputs/apk/phone/release/app-phone-release.apk GutsAndBoltsPlayer-Android.apk
          cp android/app/build/outputs/apk/quest/release/app-quest-release.apk GutsAndBoltsPlayer-Quest.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            GutsAndBoltsPlayer-Android.apk
            GutsAndBoltsPlayer-Quest.apk

  ios-simulator:
    name: iOS Player (simulator and device compile)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure iOS simulator
        run: |
          cmake -S . -B build-ios-sim -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release
      - name: Compile simulator Player
        run: cmake --build build-ios-sim --config Release --target GutsAndBoltsPlayer
      - name: Package simulator app for inspection
        run: |
          app="build-ios-sim/Release-iphonesimulator/GutsAndBoltsPlayer.app"
          if [ ! -d "$app" ]; then
            echo "::error::Simulator app bundle was not produced at $app"
            find build-ios-sim -type d -name GutsAndBoltsPlayer.app -print
            exit 1
          fi
          echo "Built app bundle: $app"
          test -f "$app/Info.plist" || { echo "::error::Missing Info.plist"; exit 1; }
          # Xcode's generated post-build script does not reliably stage these
          # directories into the .app. Copy them explicitly before packaging.
          mkdir -p "$app/Resources"
          for resource in games catalog assets; do
            ditto "$resource" "$app/Resources/$resource"
          done
          find "$app" -maxdepth 3 -print | sort | head -200
          for resource in games catalog assets; do
            if [ ! -d "$app/Resources/$resource" ]; then
              echo "::error::Missing packaged resource directory: $app/Resources/$resource"
              echo "Bundle directories:"
              find "$app" -maxdepth 3 -type d -print | sort
              exit 1
            fi
            echo "Verified resource directory: $resource"
          done
          ditto -c -k --sequesterRsrc --keepParent "$app" GutsAndBoltsPlayer-iOS-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: GutsAndBoltsPlayer-iOS-Simulator.zip
          if-no-files-found: error
      - name: Configure iOS device target (unsigned)
        run: |
          cmake -S . -B build-ios-device -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release
      - name: Compile device Player (signing not required for compile)
        run: |
          cmake --build build-ios-device --config Release --target GutsAndBoltsPlayer -- CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGNING_IDENTITY=""

  web:
    name: Web Player (Safari and other browsers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install 3.1.74
          "$HOME/emsdk/emsdk" activate 3.1.74
      - name: Build
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          web/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: web/out
          if-no-files-found: error

  linux:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release v')
    name: Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install libraries
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libglfw3-dev libglew-dev libglm-dev libx11-dev
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Run native CTest regression suite
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: |
          mkdir -p GutsAndBolts-Linux
          cp build/GutsAndBolts build/GutsAndBoltsPlayer build/GutsAndBoltsGameServer GutsAndBolts-Linux/
          cp -r games catalog GutsAndBolts-Linux/
          tar czf GutsAndBolts-Linux.tar.gz GutsAndBolts-Linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: GutsAndBolts-Linux.tar.gz

  windows:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release v')
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
            mingw-w64-x86_64-glfw mingw-w64-x86_64-glew mingw-w64-x86_64-glm git
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Package
        run: |
          mkdir -p GutsAndBolts-Windows
          cp build/*.exe build/*.dll GutsAndBolts-Windows/ 2>/dev/null || cp build/*.exe GutsAndBolts-Windows/
          cp -r games catalog GutsAndBolts-Windows/
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: GutsAndBolts-Windows

  macos:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release v')
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libraries
        run: brew install glfw glew glm ninja
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          # (compile errors also show up on the pull request, not just in the log)
          set -o pipefail
          cmake --build build 2>&1 | tee build.log || { grep -E "error" build.log | head -20 | sed 's/^/::error::/'; exit 1; }
      - name: Package
        run: |
          mkdir -p GutsAndBolts-macOS
          cp build/GutsAndBolts build/GutsAndBoltsPlayer build/GutsAndBoltsGameServer GutsAndBolts-macOS/
          cp -r games catalog GutsAndBolts-macOS/
          zip -r GutsAndBolts-macOS.zip GutsAndBolts-macOS
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: GutsAndBolts-macOS.zip

  release:
    name: Publish release
    if: always() && needs.android.result == 'success' && github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release v'))
    needs: [android, linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write   # proves to gutsandbolts.net that this is our release build (see worker/downloads.js)
    steps:
      - name: Which version
        id: rel
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then t="${GITHUB_REF#refs/tags/}";
          elif [[ "$MSG" =~ \[release\ (v[0-9][0-9A-Za-z.\-]*)\] ]]; then t="${BASH_REMATCH[1]}"; fi
          echo "tag=$t" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      # The release's name: the version plus the update's own name, from the first
      # line of RELEASE_NOTES.md ("# Guts&Bolts 0.6.1: The Hydromania Update (date)").
      # Its notes: that newest section only.
      - name: Release name and notes
        id: notes
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          python3 - <<'PY'
          import os, re
          text = open("RELEASE_NOTES.md", encoding="utf-8").read()
          first = text.splitlines()[0] if text else ""
          m = re.match(r"#\s*Guts&Bolts\s+[^:]+:\s*(.*?)\s*(\(.*\))?\s*$", first)
          title = f"Guts&Bolts {os.environ['TAG']}" + (f": {m.group(1)}" if m and m.group(1) else "")
          parts = re.split(r"(?m)^# ", text)
          newest = ("# " + parts[1]).strip() if len(parts) > 1 else text
          open("release_notes_latest.md", "w", encoding="utf-8").write(newest + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"name={title}\n")
          print(title)
          PY
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Gather files
        run: |
          mkdir -p out
          cp dist/android/*.apk out/ || true
          cp dist/linux/*.tar.gz out/ 2>/dev/null || true
          cp dist/macos/*.zip out/ 2>/dev/null || true
          if [ -d dist/windows ]; then (cd dist && zip -qr ../out/GutsAndBolts-Windows.zip windows); fi
          ls -la out
      # The downloads live on gutsandbolts.net (Cloudflare), the only place people get the apps.
      # GitHub signs a short-lived token for this run; the site checks it before taking the files.
      - name: Upload to gutsandbolts.net
        env:
          TAG: ${{ steps.rel.outputs.tag }}
          NAME: ${{ steps.notes.outputs.name }}
        run: |
          TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=gutsandbolts.net" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          for f in out/*; do
            echo "Uploading $(basename "$f")"
            curl -fsS --retry 3 -X PUT -H "Authorization: Bearer $TOKEN" --data-binary @"$f" \
              "https://gutsandbolts.net/download/upload/$(basename "$f")?version=$TAG"
            echo
          done
          python3 - <<'PY' > manifest.json
          import json, os
          files = {}
          for f in os.listdir("out"):
              kind = "quest" if "Quest" in f else "android" if f.endswith(".apk") else "windows" if "Windows" in f else "mac" if "macOS" in f else "linux" if "Linux" in f else None
              if kind: files[kind] = f
          print(json.dumps({"version": os.environ["TAG"], "name": os.environ.get("NAME", ""),
                            "notes": open("release_notes_latest.md", encoding="utf-8").read(), "files": files}))
          PY
          curl -fsS --retry 3 -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            --data-binary @manifest.json https://gutsandbolts.net/download/publish
      # Re-releasing the same version replaces it: the old release and its tag go first.
      - name: Replace an older release of this version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: gh release delete "$TAG" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.notes.outputs.name }}
          files: out/*
          prerelease: true
          body_path: release_notes_latest.md
      # Tell Discord (see devlog.yml; releases made here don't start other workflows).
      - name: Announce on Discord
        if: success()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TAG: ${{ steps.rel.outputs.tag }}
          NAME: ${{ steps.notes.outputs.name }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "No DISCORD_WEBHOOK secret: skipping."; exit 0; fi
          python3 - <<'PY'
          import json, os, urllib.request
          tag, repo = os.environ["TAG"], os.environ["REPO"]
          url = f"https://github.com/{repo}/releases/tag/{tag}"
          notes = open("release_notes_latest.md", encoding="utf-8").read()
          notes = notes if len(notes) <= 3500 else notes[:3499] + "…"
          url = "https://gutsandbolts.net/#download"
          embed = {"title": f"📦 New release: {os.environ.get('NAME') or 'Guts&Bolts ' + tag}", "url": url, "color": 0x16A34A,
                   "description": notes + f"\n\n**[Download it here]({url})** · [Website](https://gutsandbolts.net)"}
          body = json.dumps({"username": "Guts&Bolts Dev Log", "embeds": [embed]}).encode()
          req = urllib.request.Request(os.environ["WEBHOOK"], data=body,
                                       headers={"Content-Type": "application/json", "User-Agent": "GutsAndBolts-DevLog"})
          urllib.request.urlopen(req, timeout=20)
          print("Announced", tag)
          PY
